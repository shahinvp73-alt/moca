# render.yaml
version: "1"

services:
  # 1. Django Backend
  - type: web
    name: moca-backend
    env: python
    plan: free
    buildCommand: "cd backend/mocaproject && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py createsuperuser --noinput || true"
    startCommand: "cd backend/mocaproject && gunicorn mocaproject.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moca-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@moca.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "AdminPass123!"

  # 2. React Frontend
  - type: web
    name: moca-frontend
    env: static
    buildCommand: "cd front-end/my-react-app && npm install && npm run build"
    staticPublishPath: "./front-end/my-react-app/dist"
    # Using Render's built-in React Router redirect rules
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  # 3. PostgreSQL Database
  - name: moca-db
    databaseName: moca_db
    user: moca_user
    plan: free
